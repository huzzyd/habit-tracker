<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <style>
    body { margin: 0; font-family: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive; color: #1f1f1f; }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f6f2; display: flex; flex-direction: column; gap: 18px; padding: 72px 24px 40px 24px; border: 2px solid #1f1f1f;">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <div style="font-size: 14px; color: #9a9a9a; letter-spacing: 1px;">HOME. DAY 7 OF 30</div>
    <div style="font-size: 14px; color: #9a9a9a;">Days 4 to 14. Settling in.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 2px solid #1f1f1f; border-radius: 12px; background: #ffffff;">
    <div style="font-size: 16px; color: #9a9a9a;">Reclaimed</div>
    <div style="font-size: 40px; line-height: 1;">$84</div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="height: 10px; border: 2px solid #1f1f1f; border-radius: 5px; overflow: hidden; background: #ffffff;">
        <div style="height: 100%; width: 28%; background: #b45309;"></div>
      </div>
      <div style="font-size: 14px; color: #9a9a9a;">The trip. $84 of $300. $24 released by prizes so far.</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: 2px solid #1f1f1f; border-radius: 12px; background: #ffffff;">
      <div style="font-size: 14px; color: #9a9a9a;">Clear days</div>
      <div style="font-size: 28px; line-height: 1;">7</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: 2px solid #1f1f1f; border-radius: 12px; background: #ffffff;">
      <div style="font-size: 14px; color: #9a9a9a;">Cravings beaten</div>
      <div style="font-size: 28px; line-height: 1;">9 of 11</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: 2px solid #1f1f1f; border-radius: 12px; background: #ffffff;">
      <div style="font-size: 14px; color: #9a9a9a;">Draws per win</div>
      <div style="font-size: 28px; line-height: 1;">8</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: 2px solid #1f1f1f; border-radius: 12px; background: #ffffff;">
      <div style="font-size: 14px; color: #9a9a9a;">Build</div>
      <div style="font-size: 28px; line-height: 1;">4 traits</div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 16px; border: 2px dashed #9a9a9a; border-radius: 12px;">
    <div style="font-size: 18px;">Today's Quest: wash the hoodie</div>
    <div style="font-size: 16px; color: #b45309;">Done</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 16px; border: 2px dashed #9a9a9a; border-radius: 12px;">
    <div style="font-size: 18px;">Night session</div>
    <div style="font-size: 16px; color: #9a9a9a;">21:55</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 64px; display: flex; align-items: center; justify-content: center; background: #b45309; color: #ffffff; font-size: 24px; border-radius: 32px;">Craving</div>
    <div style="font-size: 14px; color: #9a9a9a; text-align: center;">Same tap as the widget. Always at the bottom.</div>
  </div>
</div>
</x-dc>
</body>
</html>
